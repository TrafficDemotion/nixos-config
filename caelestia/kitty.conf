# ═══════════════════════════════════════════════════════════════════════════════
# kitty 的配色 —— 这份是【模板】，由 Caelestia 用当前壁纸现算的配色渲染
#
#   模板源文件：/etc/nixos/caelestia/kitty.conf（本文件，声明式；改它要 nixos-rebuild）
#   模板副本：  ~/.config/caelestia/templates/kitty.conf（由 home.nix 的 xdg.configFile 生成）
#   渲染结果：  ~/.local/state/caelestia/theme/kitty.conf
#   取用方：    ~/.config/kitty/kitty.conf 里的 include（home.nix 的 programs.kitty.settings）
#
# 机制：Caelestia 的 CLI 有一个官方的用户模板口子 —— 每次换壁纸 / 换配色方案
# （caelestia wallpaper -f|-r、scheme set，GUI 里点也一样）都会把
# ~/.config/caelestia/templates/ 下的每个文件用当前配色重写一遍到
# ~/.local/state/caelestia/theme/<同名文件>。
# 占位符：两层花括号包住「颜色名.属性」，属性可用 hex / rgb / hsl / red 等；
# 颜色名与 ~/.local/state/caelestia/scheme.json 里的键一一对应，别自己发明名字。
# 例：surface 的 hex 会被换成 131413（不带 #，所以下面的行都自己补了 #）。
# 另有一个单独的 mode 占位符，换成 dark 或 light。
# ⚠️ 注意：渲染是纯文本替换，连【注释里的】占位符也会被换掉（比如上面这句如果写成真的
#    花括号示例，渲染结果里就会变成颜色值），所以文档示例别用真花括号。
#
# 为什么这么挑颜色：Caelestia 换配色时还会往所有终端的 /dev/pts 推一组 OSC 序列
# （cli 的 theme.py: apply_terms / gen_sequences，kitty 支持 OSC 4/10/11/12/17），
# 用来【立刻】改掉已经开着的终端。那份序列用的是 surface / onSurface / secondary /
# term0..term15。所以这里的终端本体颜色刻意对齐同一组键 —— 运行中的窗口（OSC 现改）
# 和之后新开的窗口（读本文件）颜色一致，不会窗口之间互相打架。
# 界面颜色（标题栏、边框、链接）Caelestia 不推 OSC，纯配置层，用 M3 的语义色。
# ═══════════════════════════════════════════════════════════════════════════════

# ── 终端本体 ─────────────────────────────────────────────────────────────────
# 背景走 M3 的容器阶梯（不用 surface —— 那是 tone 6 ≈ #131413 的近黑底色，跟壁纸明暗无关）。
# 2026-09-17 用户要求「dark 背景亮一点、light 背景暗一点」：容器阶梯往上走正好就是这个方向
# （同一档在两种模式下共用一个名字，模板层没有条件判断，所以只能靠挑档位来做到）。
# 实测（当前壁纸，L* = 感知亮度；surfaceContainer → surfaceContainerHighest）：
#   dark   #141a1e L*8.8  →  #1f272b L*15.0   （亮一点 ✓）
#   light  #e9eff3 L*94.1 →  #dbe4ea L*90.1   （暗一点 ✓）
# 想再明显一档就换成 surface1（dark #292e31 / light #ccd1d4，约 ±10 L*，两套模式幅度对称）；
# 想退回原样就把下面三处容器名各降一档（background → surfaceContainer、
# 选区 → surfaceContainerHighest、标签条 → surfaceContainerLow）。
# （CLI 往终端推的 OSC 序列写死了 surface，所以 home.nix 里把 theme.enableTerm 关了，
#   终端颜色一律以这份配置为准，换壁纸后新开的窗口才不会被瞬间推成纯黑。）
background            #{{ surfaceContainerHighest.hex }}
foreground            #{{ onSurface.hex }}
cursor                #{{ secondary.hex }}
cursor_text_color     #{{ onSecondary.hex }}
# 选区：背景已经占了容器阶梯最高一档，所以改用 Caelestia 自带的那条对称灰阶 surface2
# （= surface 向 outline 混 43%：dark 更亮、light 更暗，两套模式都离新背景约 10 L*，
# 比原来「背景 + 两档容器」还清楚一点）。仍是中性灰，不会变成彩色块。
# 不用 secondary/onSecondary：M3 的 secondary 在 dark 是浅色、light 是深色，
# 拿来做选区块会让浅色主题里出现一块近黑的深色。
selection_background  #{{ surface2.hex }}
selection_foreground  #{{ onSurface.hex }}

# ── 界面：链接 / 边框 / 标签栏 ───────────────────────────────────────────────
url_color               #{{ tertiary.hex }}
active_border_color     #{{ primary.hex }}
inactive_border_color   #{{ outlineVariant.hex }}
# 活动标签：secondaryContainer 在两套模式下都是柔和的容器色（primary 在 light 下是深绿块）
active_tab_background   #{{ secondaryContainer.hex }}
active_tab_foreground   #{{ onSecondaryContainer.hex }}
# 标签条 / 非活动标签：贴着背景再"远"一档 = surfaceContainerHigh
# （dark 比背景暗、light 比背景亮，与旧方案「背景 surfaceContainer + 标签 surfaceContainerLow」
#   的方向一致、差值也差不多，约 3 L* 以内）。
inactive_tab_background #{{ surfaceContainerHigh.hex }}
inactive_tab_foreground #{{ onSurface.hex }}
tab_bar_background      #{{ surfaceContainerHigh.hex }}

# ── ANSI 16 色（= scheme.json 的 term0..term15）──────────────────────────────
color0  #{{ term0.hex }}
color1  #{{ term1.hex }}
color2  #{{ term2.hex }}
color3  #{{ term3.hex }}
color4  #{{ term4.hex }}
color5  #{{ term5.hex }}
color6  #{{ term6.hex }}
color7  #{{ term7.hex }}
# color8 = bright black：M3 在 light 下把它生成为 #0f0f0f（比正文 onSurface #2a3432 还黑），
# 注释/次要界面元素用它就会「偏黑」；outline 在 dark(#8c9290)/light(#727d7a) 都是中灰。
color8  #{{ outline.hex }}
color9  #{{ term9.hex }}
color10 #{{ term10.hex }}
color11 #{{ term11.hex }}
color12 #{{ term12.hex }}
color13 #{{ term13.hex }}
color14 #{{ term14.hex }}
color15 #{{ term15.hex }}
